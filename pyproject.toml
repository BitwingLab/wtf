[project]
name = "huh"
version = "0.1.0"
description = "Explain terminal errors in plain English, with a one-keypress fix."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.scripts]
huh = "huh.cli:main"
wtf = "huh.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/huh"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Chinese punctuation is intentional in zh-CN strings.
allowed-confusables = ["，", "：", "（", "）", "；"]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
